<table
  width="389"
  cellspacing="0"
  cellpadding="0"
  border="0"
  align="center"
  id="mainTable"
  style="
    font-family: Lato, Helvetica, arial, sans-serif;
    font-size: 16px;
    border-spacing: 0px;
    border-collapse: collapse;
  "
>
  <tbody>
    <tr>
      <td
        width="389"
        style="
          padding: 30px 20px 20px 20px;
          background-color: #f5f5f5;
          border-bottom: 1px solid #e0e0e0;
        "
      >
        <table width="100%" cellspacing="0" cellpadding="0" border="0">
          <tbody>
            <tr>
              <td align="left" style="padding: 0px 0px 20px 0px;">
                <img
                  src="https://www.acumailme.com/Images/logo.png"
                  alt="AcuMail Me"
                  width="150"
                  style="display: block; border: none;"
                />
              </td>
            </tr>
            <tr>
              <td
                align="left"
                style="
                  font-size: 20px;
                  font-weight: bold;
                  color: #333333;
                  padding: 0px 0px 10px 0px;
                "
              >
                Receipt
              </td>
            </tr>
            <tr>
              <td
                align="left"
                style="
                  font-size: 12px;
                  color: #666666;
                  padding: 0px;
                  line-height: 1.6;
                "
              >
                <p>Thank you for your payment. Here is your receipt:</p>
              </td>
            </tr>
          </tbody>
        </table>
      </td>
    </tr>
    <tr>
      <td
        width="389"
        style="
          padding: 30px 20px 30px 20px;
          background-color: #ffffff;
        "
      >
        <table width="100%" cellspacing="0" cellpadding="0" border="0">
          <tbody>
            <tr>
              <td
                style="
                  font-size: 12px;
                  color: #333333;
                  padding: 0px 0px 15px 0px;
                  font-weight: bold;
                "
              >
                Order Details
              </td>
            </tr>
            <tr>
              <td
                style="
                  font-size: 12px;
                  color: #666666;
                  padding: 0px 0px 10px 0px;
                  line-height: 1.8;
                "
              >
                <table width="100%" cellspacing="0" cellpadding="0" border="0">
                  <tbody>
                    <tr>
                      <td style="padding: 5px 0px;">Description:</td>
                      <td style="padding: 5px 0px; text-align: right;">
                        {ORDER_DESCRIPTION}
                      </td>
                    </tr>
                    <tr>
                      <td style="padding: 5px 0px;">Amount:</td>
                      <td style="padding: 5px 0px; text-align: right;">
                        ${ORDER_AMOUNT}
                      </td>
                    </tr>
                    <tr>
                      <td style="padding: 5px 0px;">Transaction ID:</td>
                      <td style="padding: 5px 0px; text-align: right;">
                        {TRANSACTION_ID}
                      </td>
                    </tr>
                    <tr>
                      <td style="padding: 5px 0px;">Date:</td>
                      <td style="padding: 5px 0px; text-align: right;">
                        {DATE}
                      </td>
                    </tr>
                  </tbody>
                </table>
              </td>
            </tr>
          </tbody>
        </table>
      </td>
    </tr>
    <tr>
      <td
        width="389"
        style="
          padding: 20px;
          background-color: #f5f5f5;
          border-top: 1px solid #e0e0e0;
          text-align: center;
          font-size: 11px;
          color: #999999;
        "
      >
        <p style="margin: 0px; padding: 0px;">
          If you have any questions, please contact us at
          <a
            href="mailto:support@acumailme.com"
            style="color: #0066cc; text-decoration: none;"
          >
            support@acumailme.com
          </a>
        </p>
      </td>
    </tr>
  </tbody>
</table>
